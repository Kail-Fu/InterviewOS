services:
  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: InterviewOS API
      APP_ENV: dev
      APP_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:5173
      CORS_ORIGINS: "[\"*\"]"
      EMAIL_PROVIDER: smtp
      STORAGE_PROVIDER: local
      RECORDING_PROVIDER: local
      REPORT_GRADER_PROVIDER: ${REPORT_GRADER_PROVIDER:-local}
      GRADER_WORKER_URL: http://grader:9000
      REPORT_GRADER_TIMEOUT_SECONDS: 900
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMAIL_FROM: assessment@example.com
      LOCAL_ASSETS_DIR: assets
      LOCAL_ASSESSMENT_FILENAME: example_assessment.zip
      LOCAL_SUBMISSIONS_DIR: submissions
      LOCAL_RECORDINGS_DIR: recordings
      LOCAL_DB_PATH: data/interviewos.sqlite3
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USE_TLS: "false"
      SMTP_USE_SSL: "false"
      REMINDER_DELAY_SECONDS: 120
    ports:
      - "8000:8000"
    volumes:
      - ./backend/assets:/app/assets
      - ./backend/submissions:/app/submissions
      - ./backend/recordings:/app/recordings
      - ./backend/data:/app/data
    depends_on:
      - mailpit

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  grader:
    profiles:
      - full
    build:
      context: ./grader
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "9000:9000"
    volumes:
      - ./backend/submissions:/app/submissions
      - ./backend/recordings:/app/recordings
      - ./grader/workspace:/app/workspace

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
